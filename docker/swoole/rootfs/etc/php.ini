[PHP]
date.timezone = UTC
disable_classes =
disable_functions =
display_errors = Off
log_errors = On
memory_limit = MEMORY_LIMIT
time_limit = 30s
max_execution_time = 30s
post_max_size = MAX_FILESIZE
safe_mode = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
upload_max_filesize = MAX_FILESIZE
zlib.output_compression = Off
