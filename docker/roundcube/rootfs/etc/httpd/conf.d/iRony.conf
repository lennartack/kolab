Alias /dav   /opt/app-root/src/iRony/public_html
Alias /calendars   /opt/app-root/src/iRony/public_html
Alias /addressbooks   /opt/app-root/src/iRony/public_html
Alias /principals   /opt/app-root/src/iRony/public_html
Alias /files   /opt/app-root/src/iRony/public_html

<Directory "/opt/app-root/src/iRony/public_html/">
    AllowOverride All

    <IfModule mod_authz_core.c>
        # Apache 2.4
        Require all granted
    </IfModule>
    <IfModule !mod_authz_core.c>
        # Apache 2.2
        Order Allow,Deny
        Allow from All
    </IfModule>

    RewriteEngine On
    RewriteBase /dav/
    # RewriteRule ^\.well-known/caldav   / [R,L]
    # RewriteRule ^\.well-known/carddav  / [R,L]

    RewriteCond  %{REQUEST_FILENAME}  !-f
    RewriteCond  %{REQUEST_FILENAME}  !-d
    RewriteRule  (.*)                 index.php  [qsappend,last]

</Directory>
