name: Build multi-arch images

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned sclorg/mariadb-container ref. quay.io/sclorg/mariadb-105-c9s is
  # amd64-only, so we rebuild it ourselves from source on both arches. Bump
  # this to take upstream changes.
  SCLORG_MARIADB_REMOTE: https://github.com/sclorg/mariadb-container
  SCLORG_MARIADB_REF: 777b28b25fb9862cd88096490bfc5bc5f422f6c6
  # Pinned roundcube component refs for 4.0.17. These pre-empt pin_git_refs
  # (which resolves branch HEADs) so builds use known-compatible commits.
  GIT_REF_ROUNDCUBEMAIL: 27ec6cc9cb25e1ef8b4d4ef39ce76d619caa6870
  GIT_REF_ROUNDCUBEMAIL_PLUGINS: 8192820bcdc633219d77c13096066e41388ba4d6
  GIT_REF_CHWALA: 4bdc587ba9f3d335dfcdeb064fa7ba176e7775ee
  GIT_REF_SYNCROTON: 9e991d6c7be3d765007a6024621b2af33a681394
  GIT_REF_IRONY: 4b67b8c6ba441c8005b58cd094069e6458a4d930
  # Pinned webapp ref for 4.0.17.
  KOLAB_GIT_REF: 73a42e36a691b3cf6f5e21d5f3e1f8057cf827f1

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      push_repo: ${{ steps.vars.outputs.push_repo }}
      kolab_git_remote: ${{ steps.pin.outputs.kolab_git_remote }}
      kolab_git_ref: ${{ steps.pin.outputs.kolab_git_ref }}
      imap_git_remote: ${{ steps.pin.outputs.imap_git_remote }}
      imap_git_ref: ${{ steps.pin.outputs.imap_git_ref }}
      git_remote_roundcubemail: ${{ steps.pin.outputs.git_remote_roundcubemail }}
      git_ref_roundcubemail: ${{ steps.pin.outputs.git_ref_roundcubemail }}
      git_remote_roundcubemail_plugins: ${{ steps.pin.outputs.git_remote_roundcubemail_plugins }}
      git_ref_roundcubemail_plugins: ${{ steps.pin.outputs.git_ref_roundcubemail_plugins }}
      git_remote_chwala: ${{ steps.pin.outputs.git_remote_chwala }}
      git_ref_chwala: ${{ steps.pin.outputs.git_ref_chwala }}
      git_remote_syncroton: ${{ steps.pin.outputs.git_remote_syncroton }}
      git_ref_syncroton: ${{ steps.pin.outputs.git_ref_syncroton }}
      git_remote_autoconf: ${{ steps.pin.outputs.git_remote_autoconf }}
      git_ref_autoconf: ${{ steps.pin.outputs.git_ref_autoconf }}
      git_remote_irony: ${{ steps.pin.outputs.git_remote_irony }}
      git_ref_irony: ${{ steps.pin.outputs.git_ref_irony }}
      git_remote_freebusy: ${{ steps.pin.outputs.git_remote_freebusy }}
      git_ref_freebusy: ${{ steps.pin.outputs.git_ref_freebusy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify ref is reachable from master or 4.0.17
        run: |
          set -e
          git fetch --quiet origin master 4.0.17
          if git merge-base --is-ancestor HEAD origin/master; then
            echo "HEAD is reachable from origin/master"
          elif git merge-base --is-ancestor HEAD origin/4.0.17; then
            echo "HEAD is reachable from origin/4.0.17"
          else
            echo "Refusing to build: HEAD is not reachable from master or 4.0.17"
            exit 1
          fi

      - id: vars
        run: |
          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "push_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: pin
        name: Pin git refs (once, shared across arches)
        run: |
          set -e
          source bin/podman_shared
          pin_git_refs
          {
            echo "kolab_git_remote=$KOLAB_GIT_REMOTE"
            echo "kolab_git_ref=$KOLAB_GIT_REF"
            echo "imap_git_remote=$IMAP_GIT_REMOTE"
            echo "imap_git_ref=$IMAP_GIT_REF"
            echo "git_remote_roundcubemail=$GIT_REMOTE_ROUNDCUBEMAIL"
            echo "git_ref_roundcubemail=$GIT_REF_ROUNDCUBEMAIL"
            echo "git_remote_roundcubemail_plugins=$GIT_REMOTE_ROUNDCUBEMAIL_PLUGINS"
            echo "git_ref_roundcubemail_plugins=$GIT_REF_ROUNDCUBEMAIL_PLUGINS"
            echo "git_remote_chwala=$GIT_REMOTE_CHWALA"
            echo "git_ref_chwala=$GIT_REF_CHWALA"
            echo "git_remote_syncroton=$GIT_REMOTE_SYNCROTON"
            echo "git_ref_syncroton=$GIT_REF_SYNCROTON"
            echo "git_remote_autoconf=$GIT_REMOTE_AUTOCONF"
            echo "git_ref_autoconf=$GIT_REF_AUTOCONF"
            echo "git_remote_irony=$GIT_REMOTE_IRONY"
            echo "git_ref_irony=$GIT_REF_IRONY"
            echo "git_remote_freebusy=$GIT_REMOTE_FREEBUSY"
            echo "git_ref_freebusy=$GIT_REF_FREEBUSY"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    env:
      # <local podman tag>=<ghcr image name>
      IMAGES: kolab-imap=imap kolab-webapp=webapp kolab-postfix=postfix kolab-proxy=proxy roundcube=roundcube mariadb=mariadb redis=redis kolab-amavis=amavis kolab-utils=utils
      PUSH_REPO: ${{ needs.setup.outputs.push_repo }}
      KOLAB_GIT_REMOTE: ${{ needs.setup.outputs.kolab_git_remote }}
      KOLAB_GIT_REF: ${{ needs.setup.outputs.kolab_git_ref }}
      IMAP_GIT_REMOTE: ${{ needs.setup.outputs.imap_git_remote }}
      IMAP_GIT_REF: ${{ needs.setup.outputs.imap_git_ref }}
      GIT_REMOTE_ROUNDCUBEMAIL: ${{ needs.setup.outputs.git_remote_roundcubemail }}
      GIT_REF_ROUNDCUBEMAIL: ${{ needs.setup.outputs.git_ref_roundcubemail }}
      GIT_REMOTE_ROUNDCUBEMAIL_PLUGINS: ${{ needs.setup.outputs.git_remote_roundcubemail_plugins }}
      GIT_REF_ROUNDCUBEMAIL_PLUGINS: ${{ needs.setup.outputs.git_ref_roundcubemail_plugins }}
      GIT_REMOTE_CHWALA: ${{ needs.setup.outputs.git_remote_chwala }}
      GIT_REF_CHWALA: ${{ needs.setup.outputs.git_ref_chwala }}
      GIT_REMOTE_SYNCROTON: ${{ needs.setup.outputs.git_remote_syncroton }}
      GIT_REF_SYNCROTON: ${{ needs.setup.outputs.git_ref_syncroton }}
      GIT_REMOTE_AUTOCONF: ${{ needs.setup.outputs.git_remote_autoconf }}
      GIT_REF_AUTOCONF: ${{ needs.setup.outputs.git_ref_autoconf }}
      GIT_REMOTE_IRONY: ${{ needs.setup.outputs.git_remote_irony }}
      GIT_REF_IRONY: ${{ needs.setup.outputs.git_ref_irony }}
      GIT_REMOTE_FREEBUSY: ${{ needs.setup.outputs.git_remote_freebusy }}
      GIT_REF_FREEBUSY: ${{ needs.setup.outputs.git_ref_freebusy }}

    steps:
      - uses: actions/checkout@v6

      - name: Install podman and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq skopeo

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare digests directory
        run: |
          mkdir -p digests
          echo "{}" > "digests/${{ matrix.arch }}.json"

      - name: Build base images
        run: |
          set -e
          source bin/podman_shared
          podman__build_base

      - name: Build kolab-imap
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/imap:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "imap: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_imap

      - name: Build kolab-webapp
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/webapp:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "webapp: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_webapp

      - name: Build kolab-postfix
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/postfix:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "postfix: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_postfix

      - name: Build kolab-proxy
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/proxy:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "proxy: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_proxy

      - name: Build roundcube
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/roundcube:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "roundcube: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_roundcube

      - name: Build sclorg mariadb-105 base + mariadb
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/mariadb:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "mariadb: staging tag exists, skipping"; exit 0; fi
          set -e
          git clone "$SCLORG_MARIADB_REMOTE" /tmp/sclorg-mariadb
          git -C /tmp/sclorg-mariadb checkout "$SCLORG_MARIADB_REF"
          podman build /tmp/sclorg-mariadb \
            -f /tmp/sclorg-mariadb/10.5/Dockerfile.c9s \
            -t quay.io/sclorg/mariadb-105-c9s:latest
          source bin/podman_shared
          podman__build docker/mariadb mariadb

      - name: Build redis
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/redis:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "redis: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build docker/redis redis

      - name: Build amavis
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/amavis:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "amavis: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_amavis

      - name: Build utils
        continue-on-error: true
        run: |
          STAGING="${PUSH_REPO}/utils:staging-${{ matrix.arch }}-${GITHUB_SHA}"
          if skopeo inspect --raw "docker://${STAGING}" > /dev/null 2>&1; then
            echo "utils: staging tag exists, skipping"; exit 0; fi
          source bin/podman_shared
          podman__build_utils

      - name: Push successfully built images
        run: |
          set -e
          for entry in $IMAGES; do
            local_tag="${entry%=*}"
            remote_name="${entry#*=}"
            if ! podman image exists "${local_tag}:latest" 2>/dev/null; then
              echo "${remote_name}: not built, skipping push"
              continue
            fi
            staging="${PUSH_REPO}/${remote_name}:staging-${{ matrix.arch }}-${GITHUB_SHA}"
            # Skip if already pushed (from a previous run)
            if skopeo inspect --raw "docker://${staging}" > /dev/null 2>&1; then
              echo "${remote_name}: already pushed, recovering digest"
              skopeo inspect --raw "docker://${staging}" | jq -r '.digest // empty' > "digests/${remote_name}.digest" || true
              # If no digest field, compute from manifest
              if [ ! -s "digests/${remote_name}.digest" ]; then
                podman push --digestfile "digests/${remote_name}.digest" "$staging" 2>/dev/null || true
              fi
            else
              podman tag "${local_tag}:latest" "$staging"
              podman push --digestfile "digests/${remote_name}.digest" "$staging"
            fi
            if [ -s "digests/${remote_name}.digest" ]; then
              digest=$(cat "digests/${remote_name}.digest")
              jq --arg name "$remote_name" --arg d "$digest" \
                 '. + {($name): $d}' "digests/${{ matrix.arch }}.json" > digests/tmp.json
              mv digests/tmp.json "digests/${{ matrix.arch }}.json"
            fi
          done
          cat "digests/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.json
          retention-days: 1

  manifest:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      IMAGES: imap webapp postfix proxy roundcube mariadb redis amavis utils
      IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
      PUSH_REPO: ${{ needs.setup.outputs.push_repo }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest lists
        run: |
          set -e
          for img in $IMAGES; do
            amd64_digest=$(jq -r --arg n "$img" '.[$n]' digests/digests-amd64/amd64.json)
            arm64_digest=$(jq -r --arg n "$img" '.[$n]' digests/digests-arm64/arm64.json)
            if [ -z "$amd64_digest" ] || [ "$amd64_digest" = "null" ] || \
               [ -z "$arm64_digest" ] || [ "$arm64_digest" = "null" ]; then
              echo "Missing digest for $img (amd64=$amd64_digest arm64=$arm64_digest)"
              exit 1
            fi
            echo "Assembling ${img}:${IMAGE_TAG}"
            docker buildx imagetools create \
              -t "${PUSH_REPO}/${img}:${IMAGE_TAG}" \
              "${PUSH_REPO}/${img}@${amd64_digest}" \
              "${PUSH_REPO}/${img}@${arm64_digest}"
          done
